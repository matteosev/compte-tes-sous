<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WebUI</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="WebUI.styles.css" rel="stylesheet" /> -->
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>

    <script>
        (function () {
            var base = new URL(document.baseURI).pathname;
            if (base.endsWith("/")) base = base.slice(0, -1);

            var params = new URLSearchParams(window.location.search);
            var redirect = params.get("redirect");

            if (redirect) {
                history.replaceState(null, "", base + redirect);
            }
        })();
    </script>

    <!-- Prevent user from zooming accidentaly when double touching something (a button, a link...) -->
    <script>
        let lastTouchEnd = 0;

        document.addEventListener('touchend', function (event) {
            const now = Date.now();
            if (now - lastTouchEnd <= 50) { // milliseconds
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>

</head>

<body>
    <div id="app" class="container is-max-tablet p-3 is-flex is-flex-direction-column">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
