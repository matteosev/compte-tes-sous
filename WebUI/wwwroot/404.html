<!DOCTYPE html>
<html>
<head>
    <base href="/" />
    <meta charset="utf-8">
    <title>Single Page Apps for GitHub Pages</title>
    <script>
        (function () {
            // Get the base href rewritten by GitHub Actions
            var base = new URL(document.baseURI).pathname;

            // Normalize (ex: "/compte-tes-sous/" → "/compte-tes-sous")
            if (base.endsWith("/")) base = base.slice(0, -1);

            // Extract the part after base href
            var redirect = window.location.pathname.replace(base, "");

            // Redirect to index.html with a parameter
            window.location.replace(base + "/index.html?redirect=" + encodeURIComponent(redirect));
        })();
    </script>
</head>
<body>
</body>
</html>
